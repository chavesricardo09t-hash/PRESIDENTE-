name: Desplegar PRESIDENTE

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer ZIP subido
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No hay ZIP nuevo; se usa el contenido actual del repositorio."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Extrayendo $z"
            unzip -o -q "$z" -x '.github/*'
            git rm -q -f -- "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Importar ${zips[*]} (automático)" || true
          git push

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund 2>&1 | tee install.log

      - name: Guardar package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Sin cambios en package-lock.json"
          else
            git commit -q -m "Actualizar package-lock.json (automático)"
            git push
          fi

      - name: Ejecutar pruebas
        run: npm test 2>&1 | tee test.log

      - name: Compilar
        run: npm run build 2>&1 | tee build.log

      - name: Resumen del resultado
        if: always()
        run: |
          {
            echo '### Pruebas (últimas líneas)'
            echo '```'
            tail -n 40 test.log 2>/dev/null || echo '(no se ejecutaron)'
            echo '```'
            echo '### Compilación (últimas líneas)'
            echo '```'
            tail -n 40 build.log 2>/dev/null || echo '(no se ejecutó)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir página compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
