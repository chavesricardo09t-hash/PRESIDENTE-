<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12395f" />
    <meta name="description" content="PRESIDENTE - Paso 0: verificación del flujo de trabajo" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>PRESIDENTE - Paso 0</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #0d2a47;
        color: #eef3f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { margin: 8px 0 0; font-size: 2rem; letter-spacing: 0.12em; color: #f2b632; }
      .sub { margin: 4px 0 16px; color: #b8c9da; }
      .ok { background: #14532d; border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; background: #12395f; border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 9px 12px; vertical-align: top; border-bottom: 1px solid #1d4d7d; font-size: 0.95rem; }
      th { width: 38%; color: #b8c9da; font-weight: 600; }
      tr:last-child th, tr:last-child td { border-bottom: 0; }
      .botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 8px; }
      button {
        font: inherit; font-weight: 600; color: #0d2a47; background: #f2b632;
        border: 0; border-radius: 10px; padding: 12px 16px; min-height: 48px;
      }
      button[hidden] { display: none; }
      .nota { white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; color: #b8c9da; }
    </style>
  </head>

    <main id="app"><p>Cargando…</p></main>
